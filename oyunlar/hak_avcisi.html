  <span class="etiket" id="yer6" data-ist="4" style="left:92.2%;top:65.0%;background:#e84393" onclick="sec(6)">🏡 Ev</span>
  <span class="etiket" id="yer7" data-ist="5" style="left:80.4%;top:75.5%;background:#2c3e50" onclick="sec(7)">🪪 Kimlik Merkezi</span>
  <span class="etiket" id="yer8" data-ist="6" style="left:63.1%;top:85.9%;background:#9b59b6" onclick="sec(8)">🗣️ Kürsü</span>
</div>

<div id="panel"></div>

<div class="footer">Türkiye Yüzyılı Maarif Modeli | Süreç Odaklı Değer Eğitimi</div>

<script>
// ist: istasyon numarası (etiketlerdeki data-ist ile eşleşir)
var OLAYLAR = [
  {
    ist: 1, renk: "#3498db",
    yer: "🏫 Okul ve Eğitim Alanı",
    senaryo: "Can, her sabah sırt çantasıyla okuluna gidiyor, sınıfta öğretmenini dinliyor ve yeni bilgiler öğreniyor.",
    soru: "Sizce Can'ın okula gitmesi ve yeni şeyler öğrenmesi hangi temel hakkıyla doğrudan ilgilidir?",
    hak: ["Eğitim Hakkı", "Bilgi edinme ve kendini geliştirme özgürlüğü"]
  },
  {
    ist: 2, renk: "#e67e22",
    yer: "🛝 Park ve Oyun Alanı",
    senaryo: "Zeynep okuldan sonra arkadaşlarıyla parka gidip salıncağa biniyor, ip atlıyor ve neşeyle vakit geçiriyor.",
    soru: "Çocukların gün içinde oyun oynamaya, dinlenmeye ve eğlenmeye vakit ayırması neden önemlidir?",
    hak: ["Oyun ve Dinlenme Hakkı", "Sağlıklı bir büyüme ve sosyal gelişim hakkı"]
  },
  {
    ist: 3, renk: "#e74c3c",
    yer: "🏥 Sağlık Ocağı",
    senaryo: "Elif hastalandığında ailesi onu hemen doktora götürüyor. Doktor gerekli tedaviyi yaparak Elif'in iyileşmesini sağlıyor.",
    soru: "Sağlıklı büyümek, aşı olmak ve hastalandığında tedavi görmek çocukların hangi hakkıdır?",
    hak: ["Sağlık ve Yaşama Hakkı", "Korunma ve Sağlık Hizmetlerinden Yararlanma Hakkı"]
  },
  {
    ist: 6, renk: "#9b59b6",
    yer: "🗣️ Sınıf İçi Kürsü",
    senaryo: "Sınıf başkanı seçilirken herkes kendi düşüncesini, fikirlerini ve projelerini arkadaşlarına rahatça anlatabiliyor.",
    soru: "Çocukların kendi düşüncelerini özgürce ifade etmesi ve dinlenilmesi neden bir haktır?",
    hak: ["Düşünceyi İfade Etme ve Katılım Hakkı", "Kendini özgürce ifade etme ve saygı görme hakkı"]
  },
  {
    ist: 4, renk: "#e84393",
    yer: "🏡 Ev ve Aile Ortamı",
    senaryo: "Deniz'in ailesi onu her akşam sevgiyle karşılıyor. Annesi, yolda karşıdan karşıya geçerken Deniz'in elini tutuyor ve onu arabalardan koruyor.",
    soru: "Çocukların her türlü tehlikeden korunması ve sevgi dolu bir ortamda büyümesi neden önemlidir?",
    hak: ["Sevgi ve Korunma Hakkı", "Şiddetten ve zarar verici durumlardan korunma hakkı"]
  },
  {
    ist: 5, renk: "#2c3e50",
    yer: "🪪 Kimlik ve Pasaport Merkezi",
    senaryo: "Ayşe doğduğunda ailesi ona güzel bir isim verdi ve nüfus kaydını yaptırdı. Ayşe artık adının, kimliğinin ve vatandaşı olduğu bir ülkesinin olduğunu biliyor.",
    soru: "Her çocuğun bir adının, kimliğinin ve vatandaşı olduğu bir ülkesinin olması neden önemlidir?",
    hak: ["İsim ve Vatandaşlık Hakkı", "Doğduğu andan itibaren bir isme, kimliğe ve vatandaşlığa sahip olma hakkı"]
  },
  {
    ist: 0, renk: "#16a085",
    yer: "📜 Temel İlkeler ve Sözleşme (A: Eşitlik İlkesi)",
    senaryo: "Sınıfa yeni gelen Hasan'ı herkes oyuna çağırıyor. Öğretmen, çocukların dili, rengi ya da farklı özellikleri ne olursa olsun hepsine aynı şekilde davranıyor.",
    soru: "Hiçbir çocuğa \"sen farklısın\" denilerek ayrım yapılmaması neden önemlidir?",
    hak: ["Eşitlik İlkesi (Ayrımcılık Yapılmaması)", "Tüm çocukların eşit haklara sahip olması"]
  },
  {
    ist: 0, renk: "#117a65",
    yer: "📜 Temel İlkeler ve Sözleşme (B: Çocuğun Yüksek Yararı ve Yaş)",
    senaryo: "Belediye mahalleye yeni bir oyun alanı yapacak. Karar verirken \"Çocuklar için en güvenli ve en yararlı olan hangisi?\" diye düşünüyor. 18 yaşına kadar herkes çocuk sayılıyor ve hakları korunuyor.",
    soru: "Çocuklarla ilgili bir karar alınırken en çok neye dikkat edilmelidir?",
    hak: ["Çocuğun Yüksek Yararı İlkesi", "18 yaşına kadar tüm çocukların eşit olması; kararlarda çocuğun üstün yararının ve iyiliğinin gözetilmesi"]
  }
];

var aktif = -1, cozuldu = false;
var etiketler = document.querySelectorAll(".etiket");

// Olay butonlarını oluştur
var kutu = document.getElementById("butonlar");
OLAYLAR.forEach(function (o, i) {
  var b = document.createElement("button");
  b.style.background = o.renk;
  b.textContent = "🔍 Olay " + (i + 1);
  b.onclick = function () { olay_ac(i); };
  kutu.appendChild(b);
});

function temizle() {
  for (var k = 0; k < etiketler.length; k++) etiketler[k].className = "etiket";
}

function istasyonGoster(ist) {
  for (var k = 0; k < etiketler.length; k++) {
    if (+etiketler[k].getAttribute("data-ist") === ist) etiketler[k].classList.add("dogru");
  }
}

function olay_ac(i) {
  var o = OLAYLAR[i];
  aktif = i; cozuldu = false;
  temizle();
  document.body.classList.add("soru");
  var bt = document.querySelectorAll("#butonlar button");
  for (var b = 0; b < bt.length; b++) bt[b].classList.toggle("aktif", b === i);

  var li = o.hak.map(function (s) { return "• " + s; }).join("<br>");
  var p = document.getElementById("panel");
  p.style.display = "block";
  p.innerHTML =
    '<div class="ic">' +
    '<h2>🔍 Olay ' + (i + 1) + '</h2>' +
    '<h3 style="color:#34495e">📜 Olay / Durum:</h3>' +
    '<p style="color:#555">' + o.senaryo + '</p>' +
    '<h3 style="color:#d35400">💬 Sınıf İçi Tartışma Sorusu:</h3>' +
    '<p style="color:#c0392b;font-style:italic">' + o.soru + '</p>' +
    '<div class="gorev">🕵️ Görev: Bu olay hangi istasyonda geçiyor? Haritadaki istasyon etiketine dokun, sonra hangi hakla ilgili olduğunu söyle!</div>' +
    '<div id="mesaj"></div>' +
    '<div class="cevaplar">' +
      '<button style="background:#2980b9" id="yerBtn">📍 İstasyonu Göster</button>' +
      '<button style="background:#27ae60" id="hakBtn">✨ Hakkı Göster</button>' +
    '</div>' +
    '<div id="cevapAlani"></div>' +
    '<button class="tamam" id="tamam">✅ İstasyonu Tamamla ve Puan Al</button>' +
    '</div>';

  var alan = document.getElementById("cevapAlani");
  document.getElementById("yerBtn").onclick = function () {
    cozuldu = true;
    temizle();
    istasyonGoster(o.ist);
    document.getElementById("mesaj").innerHTML = '<span style="color:#2980b9">📍 İstasyon: ' + o.yer + '</span>';
  };
  document.getElementById("hakBtn").onclick = function () {
    if (!document.getElementById("hakKutu")) {
      alan.insertAdjacentHTML("beforeend", '<div class="acik" id="hakKutu"><b>✨ Doğru Hak / Yaklaşım:</b><br>' + li + '</div>');
    }
  };
  document.getElementById("tamam").onclick = function () {
    alert("Bu istasyonu başarıyla tamamladınız! Harika bir hak avcısısınız 🌟");
    p.style.display = "none";
    document.body.classList.remove("soru");
    aktif = -1;
    temizle();
    for (var b = 0; b < bt.length; b++) bt[b].classList.remove("aktif");
  };
  p.scrollIntoView({ block: "nearest" });
}

function sec(j) {
  if (aktif < 0 || cozuldu) return;
  var el = document.getElementById("yer" + j);
  var m = document.getElementById("mesaj");
  var o = OLAYLAR[aktif];
  if (+el.getAttribute("data-ist") === o.ist) {
    cozuldu = true;
    istasyonGoster(o.ist);
    m.innerHTML = '<span style="color:#27ae60">✅ Doğru istasyon! (' + o.yer + ') Şimdi hangi hakla ilgili? Söyleyin.</span>';
  } else {
    el.classList.add("yanlis");
    m.innerHTML = '<span style="color:#c0392b">❌ Bu olay burada geçmiyor, tekrar dene!</span>';
    setTimeout(function () { el.classList.remove("yanlis"); }, 700);
  }
}
</script>
</body>
</html>
